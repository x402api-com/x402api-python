name: Sync SDK from public OpenAPI

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Regenerate even when the deployed contract is unchanged
        type: boolean
        default: false
  repository_dispatch:
    types: [openapi-updated]

permissions:
  contents: write

concurrency:
  group: openapi-sdk-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Download and render the deployed public contract
        id: contract
        env:
          FORCE_GENERATION: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            --output "${RUNNER_TEMP}/openapi.json" \
            https://api.x402api.com/openapi/openapi.json
          python scripts/render-openapi.py \
            --input "${RUNNER_TEMP}/openapi.json" \
            --output "${RUNNER_TEMP}/sdk-openapi.json"
          version="$(python -c 'import json, os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/sdk-openapi.json"))["info"]["version"])')"
          if cmp -s "${RUNNER_TEMP}/sdk-openapi.json" .openapi/openapi.json \
              && [[ "${FORCE_GENERATION}" != "true" ]]; then
            printf 'generate=false\nversion=%s\n' "${version}" >>"${GITHUB_OUTPUT}"
          else
            cp "${RUNNER_TEMP}/sdk-openapi.json" .openapi/openapi.json
            printf 'generate=true\nversion=%s\n' "${version}" >>"${GITHUB_OUTPUT}"
          fi

      - name: Generate with pinned OpenAPI Generator
        if: steps.contract.outputs.generate == 'true'
        run: scripts/generate-sdk.sh

      - name: Install and validate the generated package
        if: steps.contract.outputs.generate == 'true'
        run: |
          python -m pip install .
          python -m compileall -q x402api
          python -c 'import x402api; assert x402api.Configuration().host == "https://api.x402api.com"'
          git diff --check

      - name: Commit a changed SDK
        if: steps.contract.outputs.generate == 'true'
        env:
          SDK_VERSION: ${{ steps.contract.outputs.version }}
        run: |
          set -Eeuo pipefail
          git config user.name "x402api SDK automation"
          git config user.email "sdk-automation@x402api.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Regenerate Python SDK from OpenAPI v${SDK_VERSION}"
          git push
